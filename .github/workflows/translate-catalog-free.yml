name: Free English Catalog Translation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: free-catalog-translation
  cancel-in-progress: false
jobs:
  translate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only translation dependencies
        run: |
          python -m pip install --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir transformers==4.48.3 sentencepiece==0.2.0 sacremoses==0.1.1
      - name: Translate and generate alphabetical catalog
        run: python scripts/translate_catalog_free.py
      - name: Save progress even if translation fails
        if: always()
        run: |
          if [ ! -d catalog/en/bulk ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/en/bulk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update English catalog translations and progress'
          git pull --rebase origin main
          git push origin HEAD:main
